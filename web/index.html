<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      The shell's own card describes what is at "/", and as of v0.3.0 that is
      the studio site rather than a DEX / WEBSITE splash (v8#1). Only "/" and
      the non-prerendered routes ever unfurl with these: every /detail/:id page
      gets its own description, canonical and OG tags written into a
      copy of this file at build time (scripts/prerender-og.ts), so the 440
      share cards are untouched by this change.

      The PWA keeps naming itself VINODEX below, and so does the manifest: the
      installed app IS Vinodex (start_url is /dex). The site is the studio.
    -->
    <!--
      The two faces, preloaded (v0.4.0, m1; Inter removed in v0.6.11 -- the
      app is all-retro type again, see index.css).

      They were fetched from Google through an `@import` inside index.css,
      which is the longest possible path to a glyph: the browser cannot even
      ask for the font until it has downloaded and parsed two stylesheets on
      two other origins. They are self-hosted now (`web/public/fonts/`, and
      see the long note at the top of index.css for why), so the request can
      start with the first HTML byte instead.

      Only the `latin` subsets are preloaded. `latin-ext` exists for the
      handful of Tokaji, Czech and Romanian entries in the catalogue and is
      gated behind `unicode-range`, so preloading it would pull 111 KB that
      almost every page never draws a character from.

      `crossorigin` is required even same-origin: fonts are fetched in CORS
      mode, and a preload without it is a second, wasted request.
    -->
    <link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>HORIZON/GODOT</title>
    <meta name="application-name" content="HORIZON/GODOT" />
    <meta name="description" content="Horizon/Godot is a two-person NYC studio making playful digital tools. Home of Vinodex, a retro-handheld wine encyclopedia." />
    <meta name="theme-color" content="#DC0A2D" />
    <link rel="icon" type="image/png" href="/vinodex-logo.png" />
    <link rel="apple-touch-icon" href="/vinodex-logo.png" />
    <meta name="apple-mobile-web-app-title" content="VINODEX" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Horizon/Godot" />
    <meta property="og:url" content="https://www.horizongodot.com/" />
    <!-- Per-entry OG/Twitter tags are injected at build time for
         /detail/:id pages so shared cards unfurl with the entry — see
         scripts/prerender-og.ts. Add the smart app banner here once the App
         Store listing is live: <meta name="apple-itunes-app" content="app-id=…"> -->
    <meta property="og:title" content="HORIZON/GODOT — Playful tools, made well." />
    <meta property="og:description" content="A two-person NYC studio making playful digital tools. Home of Vinodex, a retro-handheld wine encyclopedia you can play in the browser." />
    <meta property="og:image" content="/vinodex-logo.png" />
    <meta property="og:image:alt" content="VINODEX logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HORIZON/GODOT — Playful tools, made well." />
    <meta name="twitter:description" content="A two-person NYC studio making playful digital tools. Home of Vinodex, a retro-handheld wine encyclopedia you can play in the browser." />
    <meta name="twitter:image" content="/vinodex-logo.png" />
    <meta name="twitter:image:alt" content="VINODEX logo" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
